<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | North Star Bakery</title>
</head>
<body>
  <header>
    <img src="css/bakery-logo_c.png" alt="North Star Bakery logo" width="200">
    <h1>Contact Us</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Pre-Order and Contact Form</h2>
    <form action="#" method="post">
      <fieldset>
        <legend>Your Request</legend>

        <p>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </p>

        <p>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </p>

        <p>
          <label for="pickup-date">Pickup date</label>
          <input type="date" id="pickup-date" name="pickup-date" required>
        </p>

        <p>
          <label for="request-type">Request type</label>
          <select id="request-type" name="request-type" required>
            <option value="">Choose one</option>
            <option value="pre-order">Pre-order</option>
            <option value="general-question">General question</option>
          </select>
        </p>

        <p>
          <label for="item-details">Item details</label>
          <textarea id="item-details" name="item-details" rows="4" cols="40" required></textarea>
        </p>

        <p>
          <label for="allergies">Allergy notes (optional)</label>
          <textarea id="allergies" name="allergies" rows="3" cols="40"></textarea>
        </p>

        <button type="submit">Send Request</button>
      </fieldset>
    </form>

    <h2>Location</h2>
    <p>1020 Sugar Street, Topeka, Kansas.</p>

    <h2>Hours of Operation</h2>
    <p>Tuesday to Sunday: 6:00 AM-4:00 PM<br>
    Monday: Closed</p>
  </main>

  <footer>
    <p>&copy; 2026 North Star Bakery</p>
  </footer>
</body>
</html>
